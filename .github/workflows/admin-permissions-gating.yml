name: Admin Permissions Gating

on:
  pull_request:
    branches: [main]
    paths:
      - "src/pages/Admin.tsx"
      - "src/contexts/AuthContext.tsx"
      - "src/components/admin/PermissionsConfig.tsx"
      - "src/test/admin-permissions-gating.test.ts"
      - "package.json"
      - "vitest.config.ts"
      - ".github/workflows/admin-permissions-gating.yml"
  push:
    branches: [main]

jobs:
  test:
    name: Validate Admin gating against PermissionsConfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run admin permissions gating tests
        run: npx vitest run src/test/admin-permissions-gating.test.ts --reporter=verbose
